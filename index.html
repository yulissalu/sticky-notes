<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a sticky note</title>
  <style>
    :root {
      --paper: #fde68a;
      --paper-back: #fef3c7;
      --tape: #fde68a;
      --ink: #1f2937;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--ink);
      background: var(--bg);
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .container {
      width: min(100%, 900px);
      text-align: center;
    }
    h1 {
      margin: 0 0 .25rem 0;
      font-size: clamp(1.5rem, 2.5vw + 1rem, 2.25rem);
    }
    p.lead {
      margin: 0 0 1.5rem 0;
      color: #475569;
    }

    .board {
      display: flex;
      gap: clamp(1rem, 4vw, 2.5rem);
      justify-content: center;
      align-items: center;
      margin: 1.25rem 0 1.5rem;
      flex-wrap: wrap;
    }

    /* Card as a button for a11y */
    .card {
      appearance: none;
      border: 0;
      background: transparent;
      position: relative;
      width: 12rem;
      height: 12rem;
      cursor: pointer;
      perspective: 1000px;
      outline-offset: 4px;
    }
    .card:focus-visible { outline: 3px solid #0ea5e9; border-radius: 0.75rem; }

    .tape {
      position: absolute;
      left: 50%;
      top: -0.6rem;
      transform: translateX(-50%) rotate(-3deg);
      width: 4.5rem;
      height: .8rem;
      background: var(--tape);
      opacity: .7;
      border-radius: .2rem;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
      pointer-events: none;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      border-radius: 0.9rem;
      box-shadow: 0 10px 20px rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.08);
      backface-visibility: hidden;
      user-select: none;
    }
    .front {
      background: var(--paper);
      font-weight: 700;
      font-size: 1.25rem;
    }
    .back {
      background: var(--paper-back);
      transform: rotateY(180deg);
      font-weight: 800;
      font-size: 1.1rem;
      text-align: center;
      padding: 1.25rem;
    }
    .result {
      min-height: 2.2rem;
      font-size: 1.1rem;
    }
    .muted { color: #6b7280; }
    .hint { font-size: .9rem; color: #64748b; margin-top: .5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="container" role="main">
      <h1>choose one :p</h1>
      <p class="lead">flip a sticky note and send a screenshot to yulissa</p>

      <section class="board" aria-label="sticky notes">
        <!-- Sticky Note 1 -->
        <button class="card" type="button" aria-pressed="false" aria-label="option 1">
          <span class="tape" aria-hidden="true"></span>
          <div class="card-inner">
            <div class="face front">option 1</div>
            <div class="face back"><span class="back-text">union grill</span></div>
          </div>
        </button>

        <!-- Sticky Note 2 -->
        <button class="card" type="button" aria-pressed="false" aria-label="option 2">
          <span class="tape" aria-hidden="true"></span>
          <div class="card-inner">
            <div class="face front">option 2</div>
            <div class="face back"><span class="back-text">gaucho parilla</span></div>
          </div>
        </button>
      </section>

      <div id="result" class="result muted" aria-live="polite">no result yet </div>
      <div class="hint">you can still flip the other note, but the result won't change (unless you cheat)</div>
    </main>
  </div>

  <script>
    (function() {
      const cards = Array.from(document.querySelectorAll('.card'));
      const resultEl = document.getElementById('result');
      let resultLocked = false;

      function setAriaPressed(card) {
        card.setAttribute('aria-pressed', card.classList.contains('flipped') ? 'true' : 'false');
      }

      function flipCard(card) {
        card.classList.toggle('flipped');
        setAriaPressed(card);

        if (!resultLocked) {
          const backText = card.querySelector('.back-text')?.textContent?.trim() || '';
          resultEl.innerHTML = '<strong>Result:</strong> ' + backText;
          resultEl.classList.remove('muted');
          resultLocked = true;
        }
      }

      // Click and keyboard support
      cards.forEach((card) => {
        card.addEventListener('click', () => flipCard(card));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            flipCard(card);
          }
        });
      });
    })();
  </script>
</body>
</html>
